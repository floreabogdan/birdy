name: Release

# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs. Actions are
# pinned to a commit, not a tag (a tag can be moved); Dependabot bumps the pins.
permissions: {}

jobs:
  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the build provenance (keyless, via GitHub's OIDC)
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # A tag is what people install, so it has to pass the same gate as main
      # even if it was pushed from a commit CI never saw.
      - name: Test before release
        run: |
          go vet ./...
          go test ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/floreabogdan/birdy/internal/buildinfo.Version=${VERSION} -X github.com/floreabogdan/birdy/internal/buildinfo.Commit=${COMMIT}"
          targets="linux/amd64 linux/arm64 linux/arm freebsd/amd64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            export GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0
            echo "building $GOOS/$GOARCH"
            go build -trimpath -ldflags="$LDFLAGS" -o birdy ./cmd/birdy
            tar -czf "dist/birdy_${VERSION}_${GOOS}_${GOARCH}.tar.gz" birdy LICENSE README.md
            rm -f birdy
          done
          ls -la dist

      - name: Build Linux packages (.deb/.rpm/.apk)
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_VERSION: "2.47.0"
          # sha256 of nfpm_<version>_Linux_x86_64.tar.gz, from that release's
          # checksums.txt. Change it together with NFPM_VERSION.
          NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
        run: |
          # Prebuilt binary, not `go install` — the latest nfpm requires a newer
          # Go toolchain than this job's, and GOTOOLCHAIN=local blocks the upgrade.
          # The download is checked against a pinned SHA-256 before it runs: nfpm
          # builds packages whose scripts run as root on routers.
          curl -sSfL -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          NFPM="/tmp/nfpm" sh deploy/build-packages.sh "$VERSION"
          ( cd dist && sha256sum *.tar.gz *.deb *.rpm *.apk > SHA256SUMS.txt )
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true

      # Signed provenance for every asset: `gh attestation verify <file> -R
      # floreabogdan/birdy` proves it was built by this workflow from this tag.
      # Runs after the upload, so a signing outage cannot hold a release back.
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the image provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (arm64 via emulation)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records are an organization feature and need a further
          # permission; the attestation itself does not depend on them.
          create-storage-record: false

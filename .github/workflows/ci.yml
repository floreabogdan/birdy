name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to a commit, not a tag: a tag can be moved to different
# code after the fact. Dependabot bumps the pins and keeps the version comments.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Build golangci-lint from source with this job's Go, so its toolchain is
      # never older than the go.mod target (a prebuilt binary refuses that).
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          golangci-lint run ./...

      - name: go test
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: build
        run: CGO_ENABLED=0 go build ./cmd/birdy

  # A separate job so a BIRD-version quirk here never masks the unit signal
  # above. It renders birdy's config and runs the real `bird -p` parser over it.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: Install BIRD
        run: sudo apt-get update && sudo apt-get install -y bird2

      - name: integration tests
        run: |
          bird --version || true
          go test -tags integration -run TestIntegration ./...
